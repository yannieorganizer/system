const CONFIG = {
  SUPABASE_URL: "https://seglzvepigjluylbosrg.supabase.co",
  SUPABASE_ANON_KEY: "sb_publishable_6w5j4nHe_7xVVwVx6SoKHg_YLnZJunr",

const TRIAL = !CONFIG.SUPABASE_URL;

const shiftOf = s => (CFG.shifts || DEF_CFG.shifts).find(x => x.id === (s && s.shift)) || (CFG.shifts || DEF_CFG.shifts)[0];
const shTag = s => (s && s.shiftNama) || shiftOf(s).nama;
const OFF_LBL = { izin: "Izin", sakit: "Sakit" };
const curTag = s => tmMode ? "Pulang di TM · " + shTag(s) : offKind ? OFF_LBL[offKind] + " · " + shTag(s) : shTag({ shift: curShift });
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const IC = { off: '<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16M10 14l4 4M14 14l-4 4"/></svg>', cam: '<svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>', ck: '<svg viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></svg>', x: '<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>', gear: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>', user: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>', pin: '<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>', back: '<svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>', face: '<svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M9 10h.01M15 10h.01M9.5 15a3.5 3.5 0 0 0 5 0"/></svg>' };
const BLN = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"], HARI = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
const pad = n => String(n).padStart(2, "0");
const todayIso = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const hhmm = () => { const d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const longDate = () => { const d = new Date(); return HARI[d.getDay()] + ", " + d.getDate() + " " + BLN[d.getMonth()] + " " + d.getFullYear(); };
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const titleCase = s => s.trim().replace(/\s+/g, " ").toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());
function toast(m){ const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 3200); }

/* ------------------------- penyimpanan ------------------------- */
const LS = { staff: "yabsen-staff", log: "yabsen-log", cfg: "yabsen-cfg", photo: "yabsen-photo" };
const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { toast("Memori perangkat penuh"); return false; } };
let sb = null;
const Store = TRIAL ? {
  async staff(){ return lsGet(LS.staff, []); },
  async addStaff(s){ const L = lsGet(LS.staff, []); L.push(s); lsSet(LS.staff, L); },
  async logsToday(sid){ return lsGet(LS.log, []).filter(l => l.staff_id === sid && l.date === todayIso()); },
  async allLogs(){ return lsGet(LS.log, []); },
  async addLog(l){ const L = lsGet(LS.log, []); L.push(l); lsSet(LS.log, L); },
  async cfg(){ return Object.assign({}, DEF_CFG, lsGet(LS.cfg, {})); },
  async saveCfg(c){ lsSet(LS.cfg, c); },
  async selfie(id, dataUrl){ const P = lsGet(LS.photo, {}); P[id] = dataUrl; const k = Object.keys(P); while (k.length > 40) delete P[k.shift()]; lsSet(LS.photo, P); return "local:" + id; },
  photo(url){ return url && url.startsWith("local:") ? lsGet(LS.photo, {})[url.slice(6)] : url; },
  async reset(){ Object.values(LS).forEach(k => localStorage.removeItem(k)); }
} : {
  async call(action, body){ const r = await fetch(CONFIG.SUPABASE_URL + "/functions/v1/absen", { method: "POST", headers: { "Content-Type": "application/json", apikey: CONFIG.SUPABASE_ANON_KEY }, body: JSON.stringify(Object.assign({ action }, body || {})) });
    let j = null; try { j = await r.json(); } catch (e) {} if (!r.ok || !j || j.error) throw new Error((j && j.error) || "Server tidak merespons"); return j; },
  async init(){ const j = await this.call("boot"); this._boot = j; },
  async staff(){ return (this._boot && this._boot.staff) || []; },
  async cfg(){ const c = (this._boot && this._boot.cfg) || {}; return Object.assign({}, DEF_CFG, c, { lat: c.hasLoc ? 0 : null, lng: c.hasLoc ? 0 : null }); },
  faces(){ return (this._boot && this._boot.faces) || 0; },
  async saveCfg(){ throw new Error("Pengaturan diubah dari sistem utama"); }, async allLogs(){ return []; }, photo(url){ return url; }, async reset(){}
};

/* ------------------------- wajah (face-api) ------------------------- */
let FA = null, faceReady = false, faceErr = "";
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("Gagal memuat " + src)); document.head.appendChild(s); }); }
async function initFace(){
  try { if (!window.faceapi) await loadScript(CONFIG.FACE_API); FA = window.faceapi;
    await Promise.all([FA.nets.tinyFaceDetector.loadFromUri(CONFIG.MODELS), FA.nets.faceLandmark68Net.loadFromUri(CONFIG.MODELS), FA.nets.faceRecognitionNet.loadFromUri(CONFIG.MODELS)]);
    faceReady = true; } catch (e) { faceErr = "Pengenalan wajah belum bisa dimuat (periksa internet). Gunakan absen manual."; console.warn(e); }
}
async function detect(video){ if (!faceReady) return null; const r = await FA.detectSingleFace(video, new FA.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: .5 })).withFaceLandmarks().withFaceDescriptor(); return r || null; }
// cepat: hanya titik wajah (tanpa hitung identitas) untuk mendeteksi kedipan / gerak kepala
async function detectLm(video){ if (!faceReady) return null; const r = await FA.detectSingleFace(video, new FA.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: .4 })).withFaceLandmarks(); return r || null; }
const dist = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) { const d = a[i] - b[i]; s += d * d; } return Math.sqrt(s); };
function bestMatch(desc, staff){ let best = null, bd = 9, second = 9; staff.forEach(s => { const m = Math.min(...(s.face || []).map(f => dist(desc, f))); if (m < bd) { second = bd; bd = m; best = s; } else if (m < second) second = m; }); return best && bd < CONFIG.MATCH_THRESHOLD ? { s: best, d: bd } : null; }
const pd = (p, q) => Math.hypot(p.x - q.x, p.y - q.y);
function ear(eye){ return (pd(eye[1], eye[5]) + pd(eye[2], eye[4])) / (2 * pd(eye[0], eye[3]) || 1); }
function eyesEar(lm){ return (ear(lm.getLeftEye()) + ear(lm.getRightEye())) / 2; }

/* ------------------------- kamera, lokasi, foto ------------------------- */

async function whoIs(desc){ if (TRIAL) return bestMatch(desc, STAFF);
  const now = Date.now(); if (idCache.d && now - idCache.at < 1500 && dist(Array.from(desc), idCache.d) < .25) return idCache.m;
  try { const j = await Store.call("identify", { desc: Array.from(desc).map(x => +x.toFixed(5)) }); idCache = { at: now, d: Array.from(desc), m: j.match ? { s: j.match } : null }; return idCache.m; } catch (e) { return idCache.m; } }
async function runRecognize(){

  try { await startCam(v); $("camPh").hidden = true; } catch (e) { setStatus("bad", "Kamera tidak aktif", e.message); return; }
  if (!faceReady) { setStatus("warn", faceErr ? "Pengenalan wajah tidak tersedia" : "Memuat pengenal wajah…", faceErr || "Pertama kali butuh sedikit waktu, berikutnya langsung cepat"); if (!faceErr) { const w = setInterval(() => { if (faceReady || faceErr) { clearInterval(w); if (view === "scan") go("scan"); } }, 400); } return; }

  const idTick = async () => { if (!loopOn || view !== "scan") return;
    try { const r = await detect(v);
      if (!r) { who = null; hits = 0; ring(0); setStatus("", "Lihat ke kamera", "Dekatkan wajah ke lingkaran"); }
      else { const m = await whoIs(r.descriptor);
        if (!m) { who = null; hits = 0; ring(.15, "bad"); setStatus("bad", "Wajah tidak dikenali", "Belum terdaftar? Tekan “Daftar wajah baru”."); }
        else { hits = who && who.s.id === m.s.id ? hits + 1 : 1; who = m; lastDesc = Array.from(r.descriptor); ring(.35, ""); setStatus("", m.s.name, "Mengenali…", '<em>' + esc(curTag(m.s)) + '</em>');
          if (hits >= 2) return liveCheck(); } }
    } catch (err) { console.warn(err); }
    setTimeout(idTick, 250); };

  const liveCheck = () => { let base = 0, closed = false, lost = 0, x0 = null, t0 = Date.now(), frames = 0;
    setStatus("", who.s.name, "Kedipkan mata, atau tolehkan kepala sedikit", '<em>' + esc(curTag(who.s)) + '</em>');
    const tick = async () => { if (!loopOn || view !== "scan") return;
      try { const r = await detectLm(v);
        if (!r) { if (++lost > 8) { ring(0); setStatus("", "Lihat ke kamera", "Wajah keluar dari lingkaran"); who = null; hits = 0; return setTimeout(idTick, 200); } }

          if (Date.now() - t0 > 4000) setStatus("", who.s.name, "Kedipkan mata pelan, atau tolehkan kepala ke kiri / kanan", '<em>' + esc(curTag(who.s)) + '</em>'); }
      } catch (err) { console.warn(err); }

async function runEnroll(){
  const v = $("vid"), S = []; let last = null; loopOn = true;
  try { await startCam(v); $("camPh").hidden = true; } catch (e) { setStatus("bad", "Kamera tidak aktif", e.message); return; }

        let p; try { p = await getPos(); } catch (e) { return fail("Lokasi tidak terdeteksi", e.message); }
        let j; try { j = await Store.call("enroll", { name: regData.name, shift: regData.shift, phone: regData.phone, faces: S, lat: p.latitude, lng: p.longitude, acc: p.accuracy }); } catch (e) { return fail("Gagal menyimpan", e.message); }
        if (!j.ok) return fail(j.title, j.msg); await boot();

      if (S.length >= 6) { loopOn = false; ring(1, "ok"); const dup = bestMatch(S[0], STAFF); if (dup) { setStatus("bad", "Wajah sudah terdaftar", "Terdaftar atas nama " + dup.s.name + ". Silakan absen langsung."); setTimeout(() => go("home"), 3500); return; }

        catch (e) { setStatus("bad", "Gagal menyimpan", e.message || "Periksa koneksi"); } return; }
    } catch (err) { console.warn(err); }

  const tm = hhmm(), id = uid("ab"), late = type === "masuk" && tm > shiftOf(s).masuk, early = type === "pulang" && tm < shiftOf(s).pulang;
  try { const url = await Store.selfie(id, shot);
    await Store.addLog({ id, staff_id: s.id, name: s.name, shift: s.shift, date: todayIso(), type, time: tm, ts: new Date().toISOString(), lat: +p.latitude.toFixed(6), lng: +p.longitude.toFixed(6), acc: Math.round(p.accuracy || 0), dist: Math.round(dm), method, selfie: url, late, early });
  } catch (e) { return fail("Gagal mengirim absen", (e && e.message) || "Periksa koneksi internet lalu coba lagi"); }
  stopCam(); loopOn = false; saveOp(s.id, s.name);
  doneHtml = '<div class="card res ok"><div class="ic">' + IC.ck + '</div><b>Absen ' + type + ' berhasil</b><span class="nm">' + esc(s.name) + '</span><small>' + esc(shTag(s)) + ' · ' + tm + ' · ' + Math.round(dm) + ' m dari kantor</small><img class="sf" src="' + shot + '" alt="">' + (late ? '<span class="tag late">Terlambat · jam masuk ' + esc(CFG.jamMasuk) + '</span>' : early ? '<span class="tag late">Pulang lebih awal</span>' : '<span class="tag on">Tepat waktu</span>') + (method === "manual" ? '<small>Absen manual — akan dicek admin.</small>' : '') + '<div class="row" style="margin-top:16px"><button class="btn" id="dnBack">Selesai</button></div></div>';
  go("done");
}
async function submitOff(s, shot, desc){
  const kind = offKind, L = OFF_LBL[kind];
  if (!TRIAL) { let j; try { j = await Store.call("izin", { kind, note: offNote, desc: desc ? desc.map(x => +x.toFixed(5)) : undefined, selfie: shot }); } catch (e) { return fail("Gagal mengirim " + L.toLowerCase(), e.message || "Periksa koneksi internet lalu coba lagi"); }
    if (!j.ok) return fail(j.title, j.msg, j.done); return offDone(j.rec.name, j.rec.shiftNama || shTag(s), j.rec.time, kind, j.rec.note, shot); }
  let today = []; try { today = await Store.logsToday(s.id); } catch (e) {}
  if (today.some(l => l.type === "masuk")) return fail("Anda sudah absen masuk hari ini", s.name + " sudah absen masuk, jadi tidak bisa mengajukan " + L.toLowerCase() + ".", true);
  if (today.some(l => OFF_LBL[l.type])) return fail("Sudah tercatat hari ini", s.name + " sudah mengajukan izin/sakit hari ini.", true);
  const tm = hhmm(), id = uid("ab"); try { const url = await Store.selfie(id, shot); await Store.addLog({ id, staff_id: s.id, name: s.name, shift: s.shift, date: todayIso(), type: kind, time: tm, ts: new Date().toISOString(), note: offNote, method: "wajah", selfie: url, status: "approved" }); } catch (e) { return fail("Gagal menyimpan", (e && e.message) || "Coba lagi"); }
  offDone(s.name, shTag(s), tm, kind, offNote, shot); }
function offDone(name, sh, tm, kind, note, shot){ stopCam(); loopOn = false; const L = OFF_LBL[kind];
  doneHtml = '<div class="card res ok"><div class="ic">' + IC.ck + '</div><b>' + L + ' tercatat</b><span class="nm">' + esc(name) + '</span><small>' + esc(sh) + ' · ' + tm + ' WIB</small><img class="sf" src="' + shot + '" alt=""><span class="tag ' + (kind === "sakit" ? "sk" : "iz") + '">Disetujui otomatis · masuk rekap</span>' + (note ? '<small>Keterangan: ' + esc(note) + '</small>' : '') + '<small>' + (kind === "sakit" ? "Semoga lekas sembuh 🤍" : "Terima kasih sudah mengabari.") + '</small><div class="row" style="margin-top:16px"><button class="btn" id="dnBack">Selesai</button></div></div>';
  offKind = ""; offNote = ""; go("done"); }
function fail(t, m, info){ stopCam(); loopOn = false; doneHtml = '<div class="card res ' + (info ? "ok" : "bad") + '"><div class="ic">' + (info ? IC.ck : IC.x) + '</div><b>' + esc(t) + '</b><small>' + esc(m) + '</small><div class="row" style="margin-top:16px"><button class="btn gold" id="dnBack">Coba lagi</button></div></div>'; retryScan = !info; go("done"); }

/* ------------------------- pengaturan (uji coba) ------------------------- */
function settingsHtml(){
  if (!TRIAL) return '<div class="card"><h3>Pengaturan</h3><p>Lokasi kantor dan jam shift diatur oleh Owner dari sistem utama (modul Absensi).</p><div class="row"><button class="btn" id="stBack">' + IC.back + 'Kembali</button></div></div>';
  return '<div class="card"><h3>Pengaturan uji coba</h3><div class="seg">' + [["lokasi", "Lokasi & jam"], ["data", "Data uji coba"]].map(t => '<button data-st="' + t[0] + '" class="' + (setTab === t[0] ? "on" : "") + '">' + t[1] + '</button>').join("") + '</div>' +
    (setTab === "lokasi" ? '<p>' + (CFG.lat != null ? "Lokasi kantor: <b>" + (+CFG.lat).toFixed(6) + ", " + (+CFG.lng).toFixed(6) + "</b>" : "Lokasi kantor belum diatur.") + '</p><button class="btn gold" id="stHere" style="width:100%">' + IC.pin + 'Gunakan lokasi saya sekarang</button><p class="hint">Lakukan saat berada di dalam kantor. Absen ditolak bila lebih dari ' + (CFG.radius || CONFIG.RADIUS_M) + ' m dari titik ini.</p>' +
      '<div class="row" style="margin-top:12px"><div class="field" style="flex:1"><label>Jam masuk</label><input class="inp" id="stJm" value="' + esc(CFG.jamMasuk) + '" inputmode="numeric" maxlength="5"></div><div class="field" style="flex:1"><label>Jam pulang</label><input class="inp" id="stJp" value="' + esc(CFG.jamPulang) + '" inputmode="numeric" maxlength="5"></div></div><div class="field"><label>Daftar bagian (pisahkan koma)</label><input class="inp" id="stBag" value="' + esc(CFG.bagian.join(", ")) + '"></div><div class="row"><button class="btn" id="stBack">' + IC.back + 'Kembali</button><button class="btn gold" id="stSave">' + IC.ck + 'Simpan</button></div>'
    : '<div id="stData"><p>Memuat…</p></div><div class="row" style="margin-top:12px"><button class="btn" id="stBack">' + IC.back + 'Kembali</button><button class="btn" id="stReset" style="color:var(--red)">Hapus semua data uji coba</button></div>') + '</div>';
}
function bindSettings(){
  const back = $("stBack"); if (back) back.onclick = () => go("home");
  document.querySelectorAll("[data-p]").forEach((el, i, all) => { el.oninput = () => { el.value = el.value.replace(/\D/g, ""); if (el.value && all[i + 1]) all[i + 1].focus(); const pin = Array.from(all).map(x => x.value).join(""); if (pin.length === 4) { if (pin === CONFIG.TRIAL_PIN) { setOk = true; render(); } else { toast("PIN salah"); all.forEach(x => x.value = ""); all[0].focus(); } } }; if (i === 0) setTimeout(() => el.focus(), 50); });
  document.querySelectorAll("[data-st]").forEach(b => b.onclick = () => { setTab = b.dataset.st; render(); });
  if ($("stHere")) $("stHere").onclick = async () => { const b = $("stHere"); b.disabled = true; try { const p = await getPos(); CFG.lat = +p.latitude.toFixed(6); CFG.lng = +p.longitude.toFixed(6); await Store.saveCfg(CFG); toast("Lokasi kantor disimpan (akurasi ±" + Math.round(p.accuracy) + " m)"); render(); } catch (e) { toast(e.message); b.disabled = false; } };
  if ($("stSave")) $("stSave").onclick = async () => { const hm = v => { const m = /^(\d{1,2})[:.](\d{2})$/.exec(v.trim()); return m && +m[1] < 24 && +m[2] < 60 ? pad(+m[1]) + ":" + m[2] : null; }; const a = hm($("stJm").value), b = hm($("stJp").value); if (!a || !b) return toast("Format jam 24 jam, mis. 08:00");
    CFG.jamMasuk = a; CFG.jamPulang = b; CFG.bagian = $("stBag").value.split(",").map(x => x.trim()).filter(Boolean); await Store.saveCfg(CFG); toast("Pengaturan disimpan"); go("home"); };
  if ($("stReset")) $("stReset").onclick = async () => { if (!confirm("Hapus semua karyawan, wajah, dan absen uji coba di perangkat ini?")) return; const keep = { lat: CFG.lat, lng: CFG.lng }; await Store.reset(); await Store.saveCfg(Object.assign({}, DEF_CFG, keep)); await boot(); toast("Data uji coba dihapus"); go("home"); };
  if ($("stData")) (async () => { const L = (await Store.allLogs()).slice().reverse();
    $("stData").innerHTML = '<p><b>' + STAFF.length + '</b> karyawan terdaftar · <b>' + L.length + '</b> catatan absen</p><div class="list">' + (L.length ? L.slice(0, 60).map(l => '<div class="li"><img src="' + (Store.photo(l.selfie) || "") + '" alt=""><span><b>' + esc(l.name) + '</b><small>' + esc(l.bagian) + ' · ' + l.date + ' · ' + l.dist + ' m · ' + (l.method === "manual" ? "manual" : "wajah") + '</small></span><em>' + (l.type === "masuk" ? "Masuk" : "Pulang") + ' ' + l.time + (l.late ? " · telat" : "") + '</em></div>').join("") : '<p class="hint">Belum ada absen.</p>') + '</div>'; })();
}

/* ------------------------- mulai ------------------------- */
async function boot(){ try { if (!TRIAL) await Store.init(); CFG = await Store.cfg(); STAFF = await Store.staff(); } catch (e) { toast("Gagal terhubung ke server: " + (e.message || e)); } }
setInterval(() => { const c = $("clk"); if (c) c.textContent = hhmm(); }, 5000);
if (!TRIAL) setInterval(() => { if ((view === "home" || view === "scan") && !document.hidden) boot(); }, 120000);
document.addEventListener("visibilitychange", () => { if (document.hidden) { loopOn = false; stopCam(); } else if (view === "scan" || view === "enroll") render(); });
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("/absen/sw.js", { scope: "/absen/" }).catch(() => {});
(async () => { $("app").innerHTML = header() + clock() + '<div class="status"><b>Menyiapkan…</b><span>Memuat data &amp; pengenal wajah</span></div>'; bindCommon(); const fp = initFace(); await boot(); render(); fp.then(() => { if (view === "home") render(); }); })();
</script>
</body>
